name: Build Plugin JAR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 推送 main 时自动迭代小版本号（patch +1）并回写仓库；
      # [skip ci] 防止机器人提交再次触发本工作流。
      # 原因：Halo 生产模式下 Console 资源缓存 key = sha256(插件名:版本号)，
      # 版本号不变的重新部署不会刷新管理端 UI。
      - name: Bump patch version
        if: github.event_name == 'push'
        id: bump
        run: |
          current=$(grep -oP "^version '\\K[0-9]+\\.[0-9]+\\.[0-9]+" build.gradle)
          IFS='.' read -r major minor patch <<< "$current"
          new="$major.$minor.$((patch+1))"
          sed -i "s/^version '$current'/version '$new'/" build.gradle
          echo "version=$new" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle
          git commit -m "chore: bump version to $new [skip ci]"
          git push

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        # 校验服务偶发网络超时（ETIMEDOUT），不作为构建阻断项
        continue-on-error: true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-bilibili-player-${{ steps.bump.outputs.version || 'dev' }}
          path: build/libs/plugin-bilibili-player-*.jar
          if-no-files-found: error
