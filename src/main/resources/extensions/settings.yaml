apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-bilibili-player-settings
spec:
  forms:
    - group: basic
      label: 播放设置
      formSchema:
        - $formkit: checkbox
          name: enableDirect
          label: 允许浏览器直连 B 站 CDN
          help: 观众浏览器直接向 B 站 CDN 拉流，不消耗服务器带宽；默认关闭，需要时手动开启
          value: false
        - $formkit: checkbox
          name: enableServer
          label: 允许服务器代理
          help: 视频流经本服务器中转，稳定但消耗服务器带宽；默认关闭，需要时手动开启
          value: false
        - $formkit: text
          name: workerUrl
          label: Cloudflare Worker 代理地址
          help: 部署的 Worker 完整地址，留空表示未配置；填写后 Worker 通道自动启用（直连与服务器代理之间）
          placeholder: https://bili-proxy.example.com
        - $formkit: password
          name: workerToken
          label: Worker 访问令牌
          help: 可选，Worker 端配置的访问令牌
